---
storcli::package_manage: "%{facts.megaraid.present?}"
storcli::package_name:
  - 'storcli'
storcli::package_ensure: present
storcli::link_storcli_to: /usr/local/sbin/storcli

storcli::configure_settings: true

storcli::sync_time_to_controllers: true
storcli::controller_use_utc: true

# Default settings for all controllers
storcli::controller_defaults:
  autorebuild: true
  rebuildrate: 60
  perfmode: 0
  ncq: true
  cacheflushinterval: 4
  bootwithpinnedcache: false
  alarm: true
  smartpollinterval: 60
  patrolread_mode: 'auto'
  patrolread_delay: 336
  patrolread_rate: 30
  patrolread_includessds: false
  patrolread_uncfgareas: false
  consistencycheck_mode: 'conc'
  consistencycheck_delay: 672
  consistencycheck_rate: 30

# Per-controller overrides (empty by default)
storcli::controller_overrides: {}

# Default settings for all virtual drives (empty by default - VD settings not managed unless specified)
storcli::vd_defaults: {}

# Per-VD overrides (empty by default)
storcli::vd_overrides: {}
